server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers générés par Vite : leur nom change à chaque build, on peut les
    # garder un an dans le cache du navigateur.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routes de l'application (évite l'erreur 404 au rafraîchissement). L'index
    # ne doit jamais être gardé en cache : c'est lui qui désigne les fichiers
    # du dernier build.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
