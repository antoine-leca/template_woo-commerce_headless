# En-têtes de sécurité, inclus dans nginx.conf. Dans un fichier à part parce que
# nginx n'hérite pas des add_header du bloc « server » dès qu'un bloc
# « location » en déclare un : chaque bloc doit les inclure à nouveau.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Politique de contenu en mode « rapport » : le navigateur signale dans la
# console ce qu'elle bloquerait, sans rien bloquer. Après un passage complet
# du parcours d'achat (Stripe compris) sans signalement, remplacer par
# Content-Security-Policy pour l'appliquer.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://js.stripe.com https://hooks.stripe.com https://*.js.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
