<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icône du site. Le composant Seo la remplace par l'icône définie dans
         WordPress (Réglages > Général) quand il y en a une. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Valeurs par défaut, vues par les robots de partage (réseaux sociaux,
         messageries) qui n'exécutent pas JavaScript, et avant le chargement de
         l'application. Le composant Seo les remplace ensuite, page par page. -->
    <title>RAVI®</title>
    <meta
      name="description"
      content="Découvrez notre catalogue et commandez en ligne, livraison en point relais ou à domicile."
    />
    <!-- Les styles des blocs WordPress (unpkg.com) sont ajoutés par main.jsx :
         un gestionnaire onload ici serait bloqué par une politique de contenu
         (CSP) stricte. -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <!-- Fond de la page, avant tout fichier : la feuille de style de
         l'application arrive après le HTML (et, en développement, après le
         JavaScript), et la page restait blanche en attendant. Même couleur que
         --bg-color (src/index.css) ; à changer aux deux endroits. -->
    <meta name="theme-color" content="#6784c8" />
    <style>
      html,
      body {
        margin: 0;
        background-color: #6784c8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
